version: "3.8"

services:
  # ── PostgreSQL + pgvector (Vector DB + Database in one) ───────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sierra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sierra
      POSTGRES_PASSWORD: sierra2026
      POSTGRES_DB: sierra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sierra -d sierra"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (Cache) ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sierra-redis
    restart: unless-stopped
    # Host port matches the default REDIS_PORT (6379) so local dev and the
    # setup script line up. Change the left side if 6379 is taken.
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── App (full-stack local run) ────────────────────────────────────
  # Opt in with:  docker compose --profile app up --build
  # Infra-only (default) stays `docker compose up`.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sierra-app
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BACKEND_PROVIDER: local
      # Containers reach the sibling services by service name, not localhost.
      DATABASE_URL: postgresql://sierra:sierra2026@postgres:5432/sierra
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SEED_ON_BOOT: "1"
      JWT_SECRET: ${JWT_SECRET:-sierra-local-dev-secret-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
