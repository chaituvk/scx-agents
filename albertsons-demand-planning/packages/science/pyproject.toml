[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adp-science"
version = "0.1.0"
description = "Albertsons Intelligence Demand Planning - science package"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "scipy>=1.11",
  "pydantic>=2.6",
  "holidays>=0.50",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["adp_science*"]

[project.scripts]
adp = "adp_science.cli:app"
